const PAIRS = (()=>{ const p=[]; for(let i=0;i<8;i++) for(let j=i+1;j<8;j++) p.push([i,j]);
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let i=p.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
  return p.map((x,i)=> i%2? [x[1],x[0]] : x); })();

const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
function riScores(){
  if(S.riManual && S.riManual.length){ const o={}; RIASEC.forEach(t=>o[t.k]=30); const lv=[90,75,60]; S.riManual.forEach((k,i)=>o[k]=lv[i]); return o; }
  const o={}; for(const t of RIASEC){ const vals=RI_LIST.map((it,i)=>it.t===t.k?S.ri[i]:null).filter(v=>v!=null); o[t.k]= vals.length? Math.round((mean(vals)-1)/4*100):null; } return o;
}
function riDone(){ return (S.riManual&&S.riManual.length) || Object.keys(S.ri).length===RI_LIST.length; }
function riCode(sc){ return [...RIASEC].sort((a,b)=>sc[b.k]-sc[a.k] || RIASEC.indexOf(a)-RIASEC.indexOf(b)).slice(0,3).map(t=>t.k); }
function pScores(){ const o={}; for(const ax of AXES){ const v=P_LIST.map((it,i)=>it.ax===ax.id&&S.p[i]!=null?(it.pole==='a'?S.p[i]:6-S.p[i]):null).filter(x=>x!=null); o[ax.id]= v.length? Math.round((mean(v)-1)/4*100):null; } return o; }
function pDone(){ return Object.keys(S.p).length===P_LIST.length; }
function eScores(){ const o={}; ENN.forEach(e=>o[e.n]=0); E_LIST.forEach((it,i)=>{ if(S.e[i]!=null) o[it.n]+=S.e[i]; }); return o; }
function eDone(){ return Object.keys(S.e).length===E_LIST.length; }
function vScores(){ const o={}; VALUES.forEach(v=>o[v.k]=0); PAIRS.forEach((p,i)=>{ if(S.v[i]!=null) o[VALUES[S.v[i]].k]++; }); return o; }
function vDone(){ return Object.keys(S.v).length===PAIRS.length; }
function aComposite(k){ const r=S.a[k]; if(!r) return null; let s=0; for(const q of ACAD_Q){ if(r[q.k]==null) return null; s+=ACAD_W[q.k]*r[q.k]; } return s; }
function aDone(){ return SUBJ.every(s=>aComposite(s.k)!=null); }
function aCount(){ let n=0; SUBJ.forEach(s=>ACAD_Q.forEach(q=>{ if(S.a[s.k]&&S.a[s.k][q.k]!=null) n++; })); return n; }

function codeVec(code){ const v={R:0,I:0,A:0,S:0,E:0,C:0}; const w=[3,2,1]; [...code].forEach((c,i)=>v[c]=w[i]); return RIASEC.map(t=>v[t.k]); }
function centeredCos(a,b){ const ma=mean(a), mb=mean(b); let d=0,na=0,nb=0; for(let i=0;i<a.length;i++){ const x=a[i]-ma,y=b[i]-mb; d+=x*y; na+=x*x; nb+=y*y; } if(!na||!nb) return 0; return d/Math.sqrt(na*nb); }
function interestFit(code, sc){ return Math.round((centeredCos(RIASEC.map(t=>sc[t.k]), codeVec(code))+1)/2*100); }
function trackAcad(tk){ const w=TRACKS[tk].subj; let s=0,tw=0; for(const k in w){ const c=aComposite(k); if(c!=null){ s+=w[k]*c; tw+=w[k]; } } return tw? Math.round((s/tw-1)/4*100):null; }
function valueFit(vals, vs){ return Math.round(mean(vals.map(k=>vs[k]/7))*100); }
function blend(parts){ let s=0,w=0; parts.forEach(([val,wt])=>{ if(val!=null){ s+=val*wt; w+=wt; } }); return w? Math.round(s/w):null; }

function analysis(){
  const sc = riDone()? riScores(): null;
  const vs = vDone()? vScores(): null;
  const hasA = aDone();
  const tracks = Object.keys(TRACKS).map(tk=>{
    const t=TRACKS[tk];
    const i= sc? interestFit(t.code,sc): null, a= hasA? trackAcad(tk): null, v= vs? valueFit(t.vals,vs): null;
    return {tk, n:t.n, i, a, v, fit: blend([[i,.5],[a,.3],[v,.2]])};
  }).sort((x,y)=>y.fit-x.fit);
  const tMap={}; tracks.forEach(t=>tMap[t.tk]=t);
  const top3 = sc? riCode(sc): [];
  const vTop = vs? Object.entries(vs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]): [];
  const jobs = JOBS.map(([name,code,tk,vals,est,what])=>{
    const i= sc? interestFit(code,sc): null, a= hasA? tMap[tk].a: null, v= vs? valueFit(vals,vs): null;
    const why=[];
    const shared=[...code].filter(c=>top3.includes(c)); if(shared.length) why.push('흥미 일치');
    if(hasA){ const best=Object.keys(TRACKS[tk].subj).map(k=>[k,aComposite(k)]).sort((x,y)=>y[1]-x[1])[0]; if(best[1]>=3.5) why.push('교과 강점'); }
    const vv=vals.filter(k=>vTop.includes(k)); if(vv.length) why.push('가치 부합');
    return {name,code,tk,vals,est,what,fit:blend([[i,.5],[a,.3],[v,.2]]),why};
  }).sort((x,y)=>y.fit-x.fit);
  const pick=[], cnt={};
  for(const j of jobs){ if(pick.length>=9) break; if((cnt[j.tk]||0)>=3) continue; pick.push(j); cnt[j.tk]=(cnt[j.tk]||0)+1; }
  return {sc, vs, hasA, tracks, top3, vTop, jobs:pick};
}

function hexSVG(sc){
  const cx=160, cy=150, R=110, pt=(i,r)=>{ const a=(-90+60*i)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const rings=[25,50,75,100].map(v=>`<polygon points="${RIASEC.map((_,i)=>pt(i,R*v/100).join(',')).join(' ')}" fill="none" stroke="currentColor" class="text-slate-200 dark:text-slate-700" stroke-width="1"/>`).join('');
  const spokes=RIASEC.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="currentColor" class="text-slate-200 dark:text-slate-700" stroke-dasharray="2 2"/>`}).join('');
  const poly=RIASEC.map((t,i)=>pt(i,R*sc[t.k]/100).join(',')).join(' ');
  const dots=RIASEC.map((t,i)=>{const [x,y]=pt(i,R*sc[t.k]/100);return `<circle cx="${x}" cy="${y}" r="5" fill="var(--${t.k})" stroke="#fff" stroke-width="2" class="dark:stroke-slate-800"/>`}).join('');
  const labels=RIASEC.map((t,i)=>{const [x,y]=pt(i,R+26);return `<text x="${x}" y="${y-2}" text-anchor="middle" font-size="14" font-weight="800" fill="currentColor" class="text-slate-800 dark:text-slate-100">${t.k} ${t.name}</text><text x="${x}" y="${y+13}" text-anchor="middle" font-size="12" font-family="var(--mono)" fill="currentColor" class="text-slate-400">${sc[t.k]}</text>`}).join('');
  const [lx,ly]=pt(0,R*.5);
  return `<svg class="hex w-full max-w-[320px] mx-auto drop-shadow-sm" viewBox="0 0 320 310" role="img" aria-label="흥미 육각형">${rings}${spokes}
    <text x="${lx+4}" y="${ly+4}" font-size="9" font-family="var(--mono)" fill="currentColor" class="text-slate-300 dark:text-slate-600">50</text>
    <polygon points="${poly}" fill="var(--I)" fill-opacity=".15" stroke="var(--I)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

function consistency(a,b){ const ia=RIASEC.findIndex(t=>t.k===a), ib=RIASEC.findIndex(t=>t.k===b); const d=Math.min(Math.abs(ia-ib),6-Math.abs(ia-ib)); return d===1?['높음 (이웃)','두 흥미가 육각형에서 붙어 있어 관심 분야가 뚜렷해요.']:d===2?['보통 (한칸 띄움)','두 흥미가 한 칸 떨어져 있어요. 둘을 함께 쓰는 융합형 진로를 찾아보세요.']:['다양성 (마주봄)','서로 반대편 흥미를 가졌어요! 두 분야를 연결하는 독특한 직업군이 잘 맞을 수 있어요.']; }

function summaryText(){
  const A=analysis(), pS=pDone()?pScores():null, eS=eDone()?eScores():null; const L=[];
  L.push(`[나의 진로 나침반 결과 요약]`);
  L.push(`이름/별명: ${S.profile.nick||'미입력'} (${S.profile.grade||'미입력'})`);
  L.push(`작성일: ${new Date().toLocaleDateString('ko-KR')}\n`);
  if(S.profile.dream) L.push(`⭐ 처음에 적었던 꿈: ${S.profile.dream}`);
  if(A.sc) L.push(`🎨 흥미 코드 (TOP 3): ${A.top3.join('')} (${RIASEC.map(t=>t.k+': '+A.sc[t.k]).join(', ')})`);
  if(pS) L.push(`🧩 업무 성향 (MBTI식): ${AXES.map(ax=>{const v=pS[ax.id];return (v>=60?ax.a:v<=40?ax.b:'균형')}).join('')}`);
  if(A.vs) L.push(`💎 가장 중요한 가치관: ${A.vTop.join(', ')}`);
  if(A.hasA) L.push(`📚 나의 강점 교과: ${SUBJ.map(s=>[s.n,aComposite(s.k)]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]).join(', ')}`);
  if(A.tracks[0]?.fit!=null) L.push(`\n🎯 딱 맞는 추천 계열: ${A.tracks.slice(0,2).map(t=>`${t.n}`).join(', ')}`);
  if(A.sc) L.push(`🔍 알아볼 만한 직업: ${A.jobs.slice(0,5).map(j=>j.name).join(', ')}`);
  if(S.plan.goal) L.push(`\n🎯 이번 달 나의 목표: ${S.plan.goal} (${S.plan.when?S.plan.when+'까지':''})`);
  L.push('\n※ 본 결과는 자기이해를 돕기 위한 참고용 데이터입니다.');
  return L.join('\n');
}

function loadExample(){
  const s=blank(); s.example=true; s.profile={nick:'별빛',grade:'중3',dream:'아직 모르겠음'};
  const base={R:[2,1,2,3,2,2],I:[4,3,4,4,3,4],A:[5,5,4,5,5,4],S:[4,4,5,3,4,3],E:[2,3,2,1,2,2],C:[3,2,3,3,4,3]};
  RI_LIST.forEach((it,i)=>s.ri[i]=base[it.t][Math.floor(i/6)]);
  const pl={EI:'b',SN:'b',TF:'b',JP:'b'}; const strength={EI:4,SN:4,TF:4,JP:3};
  P_LIST.forEach((it,i)=>{ const hi=strength[it.ax]; s.p[i]= it.pole===pl[it.ax]? hi : 6-hi+ (it.ax==='JP'?1:0); });
  const eb={1:2,2:3,3:2,4:5,5:4,6:3,7:3,8:2,9:3}; E_LIST.forEach((it,i)=>s.e[i]=eb[it.n]); s.ePick=4;
  const pref=['창의성','자기계발','사회봉사','자율성','능력발휘','사회적인정','안정성','보수'];
  PAIRS.forEach(([x,y],i)=>{ s.v[i]= pref.indexOf(VALUES[x].k)<pref.indexOf(VALUES[y].k)? x : y; }); s.vIdx=PAIRS.length;
  const ac={kor:[5,4,4,4],eng:[4,3,3,3],math:[2,2,3,3],soc:[4,4,4,3],sci:[4,3,3,3],info:[4,3,3,2],arts:[5,5,5,4],pe:[2,2,3,2]};
  for(const k in ac) s.a[k]={int:ac[k][0],conf:ac[k][1],grade:ac[k][2],habit:ac[k][3]};
  s.plan={future:'예술고나 일반고 미술 동아리에서 작품 포트폴리오를 만들고 있다',obstacle:'완벽하게 하려다 시작을 미룬다',strategy:'매일 15분 크로키부터 무조건 시작한다',goal:'웹툰 4컷 한 편 완성하기',when:'이번 주 일요일'};
  s.view='result'; S=s; render(); window.scrollTo(0,0);
}

function firstTodo(){ const m=MODS.find(m=>m.done()<m.total()); return m? m.id : 'result'; }
function nextAfter(id){ const order=['profile','ri','p','e','v','a']; for(let k=order.indexOf(id)+1;k<order.length;k++){ const m=MODS.find(x=>x.id===order[k]); if(m.done()<m.total()) return m.id; } const rem=MODS.find(m=>m.done()<m.total()); return rem? rem.id : 'result'; }

app.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.dataset.store){ 
    S[t.dataset.store][t.dataset.i]=+t.value; 
    const c=LCONF[S.view]; 
    if(c){ 
      const n=Object.keys(S[c.store]).length; 
      const pi=app.querySelector('.pageinfo'); if(pi) pi.textContent=`${n}/${c.list.length}`; 
    } 
    save(); renderRoute(); 
  }
  else if(t.dataset.acad){ 
    (S.a[t.dataset.acad]=S.a[t.dataset.acad]||{})[t.dataset.q]=+t.value; 
    save(); renderRoute(); 
  }
  else if(t.dataset.bind){ const [a,b]=t.dataset.bind.split('.'); S[a][b]=t.value; save(); }
});

app.addEventListener('input', ev=>{ const t=ev.target; if(t.dataset.bind){ const [a,b]=t.dataset.bind.split('.'); S[a][b]=t.value; save(); } });

document.addEventListener('click', ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return; const act=b.dataset.act;
  if(act==='home') go('home');
  else if(act==='open') go(b.dataset.id, b.dataset.id==='v'? 0 : 0);
  else if(act==='next-todo') go(firstTodo());
  else if(act==='result') go('result');
  else if(act==='example') loadExample();
  else if(act==='fresh'){ S=blank(); S.view='profile'; render(); window.scrollTo(0,0); }
  else if(act==='lk-prev'){ if(S.page===0) go('home'); else go(S.view,S.page-1); }
  else if(act==='lk-next'){
    const id=b.dataset.id, c=LCONF[id], pages=Math.ceil(c.list.length/c.per), start=S.page*c.per;
    const miss=[]; for(let i=start;i<Math.min(start+c.per,c.list.length);i++) if(S[c.store][i]==null) miss.push(i);
    if(miss.length){ 
      document.getElementById(`q-${id}-${miss[0]}`).scrollIntoView({block:'center', behavior:'smooth'}); 
      toast(`앗! 대답하지 않은 문항이 ${miss.length}개 있어요 😅`); 
      return; 
    }
    if(S.page<pages-1) go(id,S.page+1);
    else if(id==='e') go('e',3);
    else { if(id==='ri') S.riManual=null; toast(`${MODS.find(m=>m.id===id).n} 완료! 🎉`); go(nextAfter(id)); }
  }
  else if(act==='ri-manual'){ S.riMode='manual'; S.riManual=S.riManual||[]; render(); }
  else if(act==='ri-toggle'){ const k=b.dataset.k, a=S.riManual||[]; const i=a.indexOf(k); if(i>=0) a.splice(i,1); else if(a.length<3) a.push(k); S.riManual=a; render(); }
  else if(act==='ri-back'){ S.riMode=null; S.riManual=null; render(); }
  else if(act==='ri-manual-done'){ S.riMode=null; toast('코드를 성공적으로 저장했어요!'); go(nextAfter('ri')); }
  else if(act==='enn-pick'){ S.ePick=+b.dataset.n; render(); }
  else if(act==='enn-back') go('e',2);
  else if(act==='v-pick'){ S.v[Math.min(S.vIdx,PAIRS.length-1)]=+b.dataset.k; S.vIdx=Math.min(S.vIdx,PAIRS.length-1)+1; if(S.vIdx>=PAIRS.length && !vDone()){ S.vIdx=PAIRS.findIndex((_,i)=>S.v[i]==null); } render(); }
  else if(act==='v-prev'){ if(S.vIdx<=0) go('home'); else { S.vIdx=Math.min(S.vIdx,PAIRS.length)-1; render(); } }
  else if(act==='v-next'){ S.vIdx=Math.min(S.vIdx+1,PAIRS.length); render(); }
  else if(act==='v-redo'){ S.v={}; S.vIdx=0; render(); }
  else if(act==='a-done'){
    const miss=[]; SUBJ.forEach(s=>ACAD_Q.forEach(q=>{ if(!(S.a[s.k]&&S.a[s.k][q.k]!=null)) miss.push(`${s.n}`); }));
    if(miss.length){ toast(`앗! ${miss[0]} 과목 등에 비어있는 칸이 있어요!`); return; }
    go(nextAfter('a')==='a'?'result':nextAfter('a'));
  }
  else if(act==='copy'){ 
    const txt=summaryText(); const done=()=>toast('결과 요약이 클립보드에 복사되었어요! 📋'); 
    try{ navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt)); }catch(e){ fallbackCopy(txt); } 
  }
  else if(act==='reset-ask'){ 
    document.getElementById('confirm-slot').innerHTML=`<div class="bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800 p-5 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 mt-6">
      <span class="text-rose-700 dark:text-rose-300 font-bold">⚠️ 모든 검사 결과와 계획이 초기화됩니다. 정말 지울까요?</span>
      <div class="flex gap-2 w-full sm:w-auto">
        <button class="${btnClasses} flex-1 sm:flex-none !py-2" data-act="reset-no">취소</button>
        <button class="${btnDangerClasses} flex-1 sm:flex-none !py-2 !bg-rose-500 !text-white !border-transparent hover:!bg-rose-600" data-act="reset-yes">네, 지울게요</button>
      </div>
    </div>`; 
  }
  else if(act==='reset-no'){ document.getElementById('confirm-slot').innerHTML=''; }
  else if(act==='reset-yes'){ S=blank(); try{localStorage.removeItem(KEY);}catch(e){} go('home'); toast('모든 기록이 깨끗하게 지워졌어요! ✨'); }
});

function fallbackCopy(txt){ 
  const slot=document.getElementById('confirm-slot'); 
  slot.innerHTML=`<div class="bg-slate-100 p-4 rounded-xl mt-4"><p class="text-sm font-bold mb-2">자동 복사가 차단되었습니다. 아래 텍스트를 길게 눌러 직접 복사해주세요.</p><textarea id="copy-box" readonly class="w-full h-40 p-3 rounded-lg border text-sm">${esc(txt)}</textarea></div>`; 
  const ta=document.getElementById('copy-box'); ta.focus(); ta.select(); 
}

const _go=go; go=function(view,page){ if(view==='v' && S.view!=='v'){ S.vIdx= vDone()? PAIRS.length : Math.max(0,PAIRS.findIndex((_,i)=>S.v[i]==null)); } if(view==='ri'){ S.riMode = (S.riManual&&S.riManual.length)?'manual':null; } _go(view,page); };
render();
</script>
